server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Seguridad: solo código propio; YouTube (sin cookies) para los videos de los lotes y Google Fonts para la tipografía.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com; media-src 'self'; frame-src https://www.youtube-nocookie.com; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }
  location ~* \.(css|js)$ { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options nosniff always; }
  location ~* \.(webp|jpg|png|svg|mp4)$ { add_header Cache-Control "public, max-age=604800"; add_header X-Content-Type-Options nosniff always; }
  location /data/raw/ { deny all; }
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { try_files $uri $uri/ /index.html; }
}
