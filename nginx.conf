server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  include /etc/nginx/cabeceras.conf;

  # Datos de extracción: nunca se sirven (^~ para que ninguna regla de extensión lo salte).
  location ^~ /data/raw/ { deny all; }
  location = /index.html { add_header Cache-Control "no-cache" always; include /etc/nginx/cabeceras.conf; }
  # CSS y JS sin versión en la URL (así funcionan igual en GitHub Pages y en la copia de emergencia del
  # guardián, que descarta URLs con "?"): caché corta, que Cloudflare respeta. Tras un despliegue, como
  # mucho 5 minutos con la versión anterior (antes Cloudflare los guardaba horas).
  location ~* \.(css|js)$ { add_header Cache-Control "public, max-age=300" always; include /etc/nginx/cabeceras.conf; }
  # Tipografías: el nombre lleva huella, así que pueden guardarse un año.
  location ~* \.woff2$ { add_header Cache-Control "public, max-age=31536000, immutable" always; include /etc/nginx/cabeceras.conf; }
  location ~* \.(webp|jpg|png|svg|mp4)$ { add_header Cache-Control "public, max-age=604800" always; include /etc/nginx/cabeceras.conf; }
  location = /robots.txt { add_header Cache-Control "public, max-age=86400" always; include /etc/nginx/cabeceras.conf; }
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { try_files $uri $uri/ /index.html; }
}
