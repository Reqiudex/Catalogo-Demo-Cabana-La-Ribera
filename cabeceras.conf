# Cabeceras de seguridad comunes. Nginx descarta las add_header del servidor en cualquier location que
# declare las suyas, así que cada location las incluye desde aquí (antes los JS/CSS salían sin ellas).
# Seguridad: solo código y tipografías propias; YouTube (sin cookies) para los videos de los lotes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://i.ytimg.com; media-src 'self'; frame-src https://www.youtube-nocookie.com; connect-src 'self' https://cloudflareinsights.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Strict-Transport-Security "max-age=31536000" always;
